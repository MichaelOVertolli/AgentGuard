[project]
name = "agentguard"
version = "0.1.0"
description = "Pre-commit + CLI scanner for prompt-injection patterns in agent-adjacent files."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Michael Vertolli", email = "michael.vertolli@creativedestructionlab.com" },
]
dependencies = [
    "click>=8.1",
    "regex>=2024.11.6",
    "rich>=13.9",
]

[project.scripts]
agentguard = "agentguard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentguard"]

[tool.hatch.build]
include = ["src/agentguard/corpus/**"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8",
]
